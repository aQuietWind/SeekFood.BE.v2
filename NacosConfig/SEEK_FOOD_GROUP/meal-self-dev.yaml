spring:
  #mysql的配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seek_food_meal
    username: root
    password: 439176


meal:
  self:
    params: 
      rules:
        meal-name-max: 15
        show-image-number-max: 10
        meal-description-max: 300
        meal-content-max: 60
        meal-type-max: 5
        meal-file-delete-day: 30
        meal-show-image-dest: "D:/home/admin/image/meal/show"
    redis:
      key:
        meal-insert-cooldown:
          name: "meal:insert:cooldown:"
          duration: 5
        meal-get-simple-cooldown:
          name: "meal:get:simple:cooldown:"
          duration: 1
        meal-get-simple-by-type-cooldown:
          name: "meal:get:simple:type:cooldown:"
          duration: 1
        meal-update-message-cooldown:
          name: "meal:update:message:cooldown:"
          duration: 3
        meal-update-show-image-cooldown:
          name: "meal:update:show:image:cooldown:"
          duration: 3
        meal-update-price-cooldown:
          name: "meal:update:price:cooldown:"
          duration: 3
        meal-update-sell-cooldown:
          name: "meal:update:sell:cooldown:"
          duration: 3
        meal-delete-cooldown:
          name: "meal:delete:cooldown:"
          duration: 3
        meal-id-count:
          name: "meal:id:count"
          duration: null
        meal-message-caffeine:
          name: "meal:message:caffeine:"
          duration: 600
      stream:
        oldFileStream:
          name: meal:stream:old:file
          key-name: fileName
          consumer:
            group-name: DeleteGroup
            number: 1
    jvm-caffeine:
      meal:
        max-size: 100000
        expire-time: 300
      meal-merchant:
        max-size: 100000
        expire-time: 300






